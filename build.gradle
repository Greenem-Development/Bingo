apply plugin: 'java'

group 'org.greenem.plugins.bingo'
version '1.0.0'

repositories {
    mavenCentral()
    maven {
    	url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' 
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.18.2-R0.1-SNAPSHOT'
}

sourceSets {
    main {
        java {
            srcDirs 'src'
        }
        resources {
            srcDir 'resources' 
        }
    }
}

jar {
	archiveBaseName = 'Bingo'
    destinationDirectory.set(file("D:/Servers/NewFreshServers/Tests1.18.2/plugins")) //D:/Stuff/Development/PluginsBuilds
    configurations.implementation.canBeResolved=true
    from { configurations.implementation.collect {
      //it.canBeResolved = true 
      it.isDirectory() ? it : zipTree(it) } 
    }
}